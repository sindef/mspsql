name: Release Images

on:
  release:
    types:
      - published

permissions: {}

env:
  REGISTRY: ghcr.io
  OWNER: sindef

jobs:
  images:
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: mspsql
            dockerfile: Dockerfile
          - name: mspsql-agent
            dockerfile: Dockerfile.agent
          - name: mspsql-gateway
            dockerfile: Dockerfile.gateway
          - name: mspsql-wireguard
            dockerfile: Dockerfile.wireguard
          - name: mspsql-tun-device-plugin
            dockerfile: Dockerfile.tun-device-plugin
          - name: mspsql-postgres-upgrade
            dockerfile: Dockerfile.upgrade
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "${version}"
          printf 'value=%s\n' "${version}" >>"${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}:${{ steps.version.outputs.value }}

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Scan image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Sign image digest
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          go run github.com/sigstore/cosign/v2/cmd/cosign@v2.6.1 sign --yes \
            "${REGISTRY}/${OWNER}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}"
