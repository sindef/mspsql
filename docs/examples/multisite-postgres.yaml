apiVersion: multisite-postgres.dev/v1alpha1
kind: MultiSitePostgres
metadata:
  name: orders
  namespace: database-platform
spec:
  deletionPolicy: Retain
  postgres:
    majorVersion: 17
    image: percona/percona-distribution-postgresql@sha256:f10a110088699edd09ab706446f2c55db9390dd56381d5d0032ee70e3fe01d2a
    synchronousStandbyCount: 1
  credentials:
    postgresVaultRef:
      mount: secret
      path: postgres/orders/bootstrap
    pgpoolVaultRef:
      mount: secret
      path: postgres/orders/pgpool
  sites:
    - name: vic
      siteRegistrationRef: production-vic
      namespace: orders-postgres
      role: Data
      primaryPreference: 100
      components: {etcdReplicas: 3, postgresReplicas: 2, pgpoolReplicas: 2}
      storage:
        etcd: {storageClassName: premium-rwo, size: 20Gi}
        postgres: {storageClassName: premium-rwo, size: 500Gi}
      loadBalancer: {addressPool: database-services}
      vaultAuth:
        address: https://vault.example.internal:8200
        authMount: kubernetes-vic
        authRole: orders-postgres-vic
        caBundleSecretRef: {name: vault-ca, key: ca.crt}
      certificates:
        etcdIssuerRef: {name: etcd-vault, kind: ClusterIssuer}
        etcdPeerIssuerRef: {name: etcd-peer-vault, kind: ClusterIssuer}
        etcdClientIssuerRef: {name: etcd-client-vault, kind: ClusterIssuer}
        postgresIssuerRef: {name: postgres-vault, kind: ClusterIssuer}
        pgpoolIssuerRef: {name: client-vault, kind: ClusterIssuer}
        backupIssuerRef: {name: backup-vault, kind: ClusterIssuer}
    - name: nsw
      siteRegistrationRef: production-nsw
      namespace: orders-postgres
      role: Data
      primaryPreference: 50
      components: {etcdReplicas: 3, postgresReplicas: 2, pgpoolReplicas: 2}
      storage:
        etcd: {storageClassName: premium-rwo, size: 20Gi}
        postgres: {storageClassName: premium-rwo, size: 500Gi}
      loadBalancer: {addressPool: database-services}
      vaultAuth:
        address: https://vault.example.internal:8200
        authMount: kubernetes-nsw
        authRole: orders-postgres-nsw
      certificates:
        etcdIssuerRef: {name: etcd-vault, kind: ClusterIssuer}
        postgresIssuerRef: {name: postgres-vault, kind: ClusterIssuer}
        pgpoolIssuerRef: {name: client-vault, kind: ClusterIssuer}
        backupIssuerRef: {name: backup-vault, kind: ClusterIssuer}
    - name: qld
      siteRegistrationRef: production-qld
      namespace: orders-postgres
      role: Witness
      components: {etcdReplicas: 1, postgresReplicas: 0, pgpoolReplicas: 0}
      certificates:
        etcdIssuerRef: {name: etcd-vault, kind: ClusterIssuer}
  backup:
    repository:
      type: S3
      bucket: database-backups
      prefix: orders
      endpoint: https://s3.example.internal
      region: ap-southeast-2
      uriStyle: path
      caBundleSecretRef: {name: object-storage-ca, key: ca.crt}
      credentialVaultRef:
        mount: secret
        path: postgres/orders/pgbackrest
    schedules:
      full: "30 6 * * 0"
      differential: "30 6 * * 1-6"
      incremental: "30 */6 * * *"
      timezone: Australia/Sydney
    retention:
      duration: 168h
      walDuration: 168h
