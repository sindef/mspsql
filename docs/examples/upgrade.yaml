apiVersion: multisite-postgres.dev/v1alpha1
kind: PostgresUpgrade
metadata:
  name: orders-pg18
  namespace: database-platform
spec:
  instanceRef: orders
  targetImage: percona/percona-distribution-postgresql:18.0-1
  targetMajorVersion: 18
  upgradeImage: ghcr.io/sindef/mspsql-postgres-upgrade:__MSPSQL_VERSION__
  serviceRestorationTarget: 15m
  rollbackRetention: 168h
  benchmark:
